# App-owned R8 rules for obfuscated Release builds (wired up by R8Obfuscation.targets).

# Readable stack traces: keep line numbers but not source file names. Play maps the renamed
# frames back with the mapping.txt that the AAB carries.
-keepattributes SourceFile,LineNumberTable
-renamesourcefileattribute SourceFile

# The .NET runtime's own Java code, reached by name from managed code. The SDK's rules keep only
# net.dot.android.crypto.**, but Android.App.Application.Context does
# FindClass("net/dot/android/ApplicationRegistration") and reads its static Context field.
-keep class net.dot.android.** { *; }
